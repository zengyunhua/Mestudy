#
# Test-only configuration for SpringContextLoadTest.
#
# target/test-classes precedes target/classes on the test classpath, so this
# file shadows the real config.properties while tests run. No other test in
# this module reads configuration (and CI runs them with no config.properties
# at all), so shadowing it changes nothing for them.
#
# Each datasource gets a DISTINCT url on purpose: that is what lets the test
# prove each bean reads its own jdbc.<schema>.url key. The production template
# gives every datasource the same url, so a bean wired to the wrong key would
# still look correct there.
#
# initialPoolSize=0 keeps c3p0 from acquiring a connection while the pool is
# being built. No test here runs a query, so no database is ever contacted.
#

jdbc.minPoolSize=0
jdbc.initialPoolSize=0
jdbc.maxPoolSize=1
jdbc.maxIdleTime=60

jdbc.dongruan.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.dongruan.url=jdbc:oracle:thin:@127.0.0.1:1521:DONGRUAN
jdbc.dongruan.username=dongruan_user
jdbc.dongruan.password=CHANGE_ME

