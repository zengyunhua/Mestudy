name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the default reactor: the modules whose dependencies are all on Maven
  # Central. NetworkOfficeService, InterfaceFunction and NetPortalManagement
  # depend on the private "bee" framework and
  # com.tecsun.sisp_public:aamanagement-client, which are not published
  # anywhere public, so they sit behind the -Pprivate-deps profile and are not
  # built here. See docs/TROUBLESHOOTING.md.
  # ---------------------------------------------------------------------------
  build:
    name: Test and package (JDK 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Show toolchain
        run: mvn -B -v

      - name: Run unit tests and package
        run: mvn -B verify

  # ---------------------------------------------------------------------------
  # Guard rails. These catch the mistakes that are easiest to make and most
  # expensive to undo once they are in the history: committed build output,
  # committed credentials, and committed personal data.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build output is tracked
        run: |
          if git ls-files | grep -E '(^|/)target/'; then
            echo "::error::Build output under target/ must not be committed."
            exit 1
          fi
          echo "OK - no target/ files tracked."

      - name: No credentials are tracked
        run: |
          bad=$(git ls-files | grep -E 'src/main/resources/(config\.properties|ds\.xml)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Local configuration files must not be committed. Use the .example templates."
            echo "$bad"
            exit 1
          fi
          echo "OK - no config.properties / ds.xml tracked."

      - name: No personal identity numbers
        run: |
          # 110101199001010015 is the documented placeholder, not real data.
          hits=$(grep -rEn '[1-9][0-9]{5}(19|20)[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx]' \
                   --include='*.java' --include='*.xml' --include='*.properties' --include='*.txt' \
                   --exclude-dir=target . \
                 | grep -v '110101199001010015' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible personal identity number found. Use the placeholder 110101199001010015."
            echo "$hits"
            exit 1
          fi
          echo "OK - no identity numbers outside the placeholder."

      - name: No private network addresses in sources
        run: |
          # 10/8 and 192.168/16 literals in Java or properties files leak internal topology.
          hits=$(grep -rEn '"(10|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]+\.[0-9]+\.[0-9]+"' \
                   --include='*.java' --include='*.properties' --include='*.xml' \
                   --exclude-dir=target . || true)
          count=$(printf '%s' "$hits" | grep -c . || true)
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count private network address literal(s) found - consider moving them to configuration."
            printf '%s\n' "$hits" | head -10
          else
            echo "OK - no private network address literals."
          fi
