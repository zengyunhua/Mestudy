#
# Test-only configuration for SpringContextLoadTest.
#
# target/test-classes precedes target/classes on the test classpath, so this
# file shadows the real config.properties while tests run.
#
# Nothing here connects to a database. DriverManagerDataSource loads the
# driver class when the property is set but opens no connection until a query
# runs, and the test never runs one.
#

jdbc.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.url=jdbc:oracle:thin:@127.0.0.1:1521:FUNC
jdbc.username=func_user
jdbc.password=CHANGE_ME
