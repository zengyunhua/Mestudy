#
# Test-only configuration. On the test classpath target/test-classes precedes
# target/classes, so this file shadows the real config.properties while
# SpringContextLoadTest runs.
#
# Every datasource gets a DISTINCT url on purpose: that is what lets the test
# prove each bean reads its own jdbc.<schema>.url key. With the production
# template - where all five urls are identical - a bean wired to the wrong key
# would still look correct.
#
# Nothing here connects to a database. DriverManagerDataSource resolves the
# driver class when the property is set but does not open a connection until a
# query runs, and the test never runs one.
#
# The password values are CHANGE_ME rather than realistic-looking strings for a
# mechanical reason: scripts/check_sensitive.py fails the CI hygiene job on any
# tracked non-placeholder value assigned to a password-named key, and a fixture
# is not worth carving an exception for. Nothing asserts these values.
#

jdbc.sisp.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.sisp.url=jdbc:oracle:thin:@127.0.0.1:1521:SISP
jdbc.sisp.username=sisp_user
jdbc.sisp.password=CHANGE_ME

jdbc.sisp_public.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.sisp_public.url=jdbc:oracle:thin:@127.0.0.1:1521:SISPPUBLIC
jdbc.sisp_public.username=sisp_public_user
jdbc.sisp_public.password=CHANGE_ME

jdbc.sisp_yth.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.sisp_yth.url=jdbc:oracle:thin:@127.0.0.1:1521:SISPYTH
jdbc.sisp_yth.username=sisp_yth_user
jdbc.sisp_yth.password=CHANGE_ME

jdbc.sisp_public_yth.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.sisp_public_yth.url=jdbc:oracle:thin:@127.0.0.1:1521:SISPPUBLICYTH
jdbc.sisp_public_yth.username=sisp_public_yth_user
jdbc.sisp_public_yth.password=CHANGE_ME

jdbc.drface.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.drface.url=jdbc:oracle:thin:@127.0.0.1:1521:DRFACE
jdbc.drface.username=drface_user
jdbc.drface.password=CHANGE_ME
